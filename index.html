                const constraints = {
                    audio: true,
                    video: video ? { facingMode: 'user' } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                if (!video) {
                    localWrap.classList.add('voice-only');
                    localWrap.innerHTML = `<i class="fas fa-phone" style="font-size:40px;color:#25d366;"></i>`;
                    localVideo.style.display = 'none';
                } else {
                    localWrap.classList.remove('voice-only');
                    localWrap.innerHTML = '';
                    localWrap.appendChild(localVideo);
                    localVideo.style.display = 'block';
                }
                return true;
            } catch (err) {
                console.error('Media error:', err);
                alert('Could not access camera/mic. Please allow permissions.');
                return false;
            }
        }

        function stopLocalStream() {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                localVideo.srcObject = null;
                localVideo.style.display = 'block';
                localWrap.classList.remove('voice-only');
                localWrap.innerHTML = '';
                localWrap.appendChild(localVideo);
            }
        }

        function createPeerConnection() {
            const pc = new RTCPeerConnection(rtcConfig);

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    broadcast({
                        type: 'webrtc_ice',
                        from: currentUser,
                        to: callPartner,
                        candidate: e.candidate
                    });
                }
            };

            pc.ontrack = (e) => {
                if (e.streams && e.streams[0]) {
                    remoteVideo.srcObject = e.streams[0];
                    remoteVideo.style.display = 'block';
                    const ph = remotePlaceholder;
                    ph.querySelector('.status').textContent = 'Connected';
                    ph.querySelector('.name').textContent = getDisplayName(callPartner);
                }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'connected') {
                    remoteStatus.textContent = 'Connected';
                    startCallTimer();
                } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    endCall();
                }
            };

            return pc;
        }

        function startCallTimer() {
            callStartTime = Date.now();
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                const elapsed = Date.now() - callStartTime;
                callTimerDisplay.textContent = formatDuration(elapsed);
            }, 1000);
        }

        function stopCallTimer() {
            if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
            }
            callTimerDisplay.textContent = '00:00';
        }

        // ----- Initiate call -----
        async function initiateCall(partner, video = true) {
            if (isCallActive) {
                alert('You are already on a call.');
                return;
            }
            if (!onlineUsers.has(partner)) {
                alert('User is offline.');
                return;
            }

            callType = video ? 'video' : 'voice';
            callPartner = partner;
            isCallInitiator = true;

            const ok = await getLocalStream(video);
            if (!ok) { isCallInitiator = false; return; }

            peerConnection = createPeerConnection();

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                broadcast({
                    type: 'webrtc_offer',
                    from: currentUser,
                    to: partner,
                    offer: offer,
                    video: video
                });

                // Show call overlay
                callOverlay.classList.add('active');
                remoteName.textContent = getDisplayName(partner);
                remoteStatus.textContent = 'Calling...';
                remoteVideo.style.display = 'none';
                remotePlaceholder.querySelector('.status').textContent = 'Calling...';
                remotePlaceholder.querySelector('.name').textContent = getDisplayName(partner);
                isCallActive = true;

                // Set call buttons
                voiceCallBtn.classList.add('active-call');
                videoCallBtn.classList.add('active-call');
                voiceCallBtn.innerHTML = '<i class="fas fa-phone-slash"></i>';
                videoCallBtn.innerHTML = '<i class="fas fa-phone-slash"></i>';

                // Update controls
                updateCallControls();

                // Timeout if no answer
                setTimeout(() => {
                    if (isCallActive && isCallInitiator && peerConnection?.connectionState === 'new') {
                        endCall();
                        alert('No answer from ' + getDisplayName(partner));
                    }
                }, 30000);

            } catch (err) {
                console.error('Offer error:', err);
                endCall();
            }
        }

        // ----- Handle incoming offer -----
        async function handleWebRTCOffer(data) {
            if (data.from === currentUser) return;
            if (isCallActive) {
                broadcast({ type: 'webrtc_busy', from: currentUser, to: data.from });
                return;
            }

            pendingOffer = data;
            callPartner = data.from;
            callType = data.video ? 'video' : 'voice';

            // Show incoming call UI
            callerName.textContent = getDisplayName(data.from);
            callerType.textContent = data.video ? 'Video call...' : 'Voice call...';
            const photo = getUserPhoto(data.from);
            callerAvatar.innerHTML = photo ? `<img src="${photo}" />` : getInitials(data.from);
            callerAvatar.style.background = photo ? 'transparent' : getAvatarColor(data.from);
            incomingCall.classList.add('active');

            // Accept
            acceptCallBtn.onclick = async () => {
                incomingCall.classList.remove('active');
                const ok = await getLocalStream(data.video);
                if (!ok) {
                    broadcast({ type: 'webrtc_reject', from: currentUser, to: data.from });
                    return;
                }

                isCallInitiator = false;
                callPartner = data.from;
                isCallActive = true;

                peerConnection = createPeerConnection();

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);

                    broadcast({
                        type: 'webrtc_answer',
                        from: currentUser,
                        to: data.from,
                        answer: answer
                    });

                    callOverlay.classList.add('active');
                    remoteName.textContent = getDisplayName(data.from);
                    remoteStatus.textContent = 'Connecting...';
                    remoteVideo.style.display = 'none';
                    remotePlaceholder.querySelector('.status').textContent = 'Connecting...';
                    remotePlaceholder.querySelector('.name').textContent = getDisplayName(data.from);

                    voiceCallBtn.classList.add('active-call');
                    videoCallBtn.classList.add('active-call');
                    voiceCallBtn.innerHTML = '<i class="fas fa-phone-slash"></i>';
                    videoCallBtn.innerHTML = '<i class="fas fa-phone-slash"></i>';

                    updateCallControls();
                } catch (err) {
                    console.error('Answer error:', err);
                    endCall();
                }
            };

            rejectCallBtn.onclick = () => {
                incomingCall.classList.remove('active');
                broadcast({ type: 'webrtc_reject', from: currentUser, to: data.from });
                callPartner = '';
                pendingOffer = null;
            };

            // Auto-reject after 25s
            setTimeout(() => {
                if (incomingCall.classList.contains('active')) {
                    incomingCall.classList.remove('active');
                    broadcast({ type: 'webrtc_reject', from: currentUser, to: data.from });
                    callPartner = '';
                    pendingOffer = null;
                }
            }, 25000);
        }

        // ----- Handle answer -----
        async function handleWebRTCAnswer(data) {
            if (data.from !== callPartner || !isCallInitiator) return;
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                remoteStatus.textContent = 'Connected';
                startCallTimer();
            } catch (err) {
                console.error('Answer set error:', err);
            }
        }

        // ----- Handle ICE -----
        function handleWebRTCIce(data) {
            if (data.from !== callPartner) return;
            if (peerConnection) {
                try {
                    peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (e) {}
            }
        }

        // ----- Handle end -----
        function handleWebRTCEnd(data) {
            if (data.from === callPartner) {
                const duration = callStartTime ? Date.now() - callStartTime : 0;
                addCallLog(callPartner, duration, false);
                endCall();
            }
        }

        // ----- Handle reject -----
        function handleWebRTCReject(data) {
            if (data.from === callPartner && isCallInitiator) {
                alert(getDisplayName(callPartner) + ' declined the call.');
                endCall();
            }
        }

        // ----- Handle busy -----
        function handleWebRTCBusy(data) {
            if (data.from === callPartner && isCallInitiator) {
                alert(getDisplayName(callPartner) + ' is on another call.');
                endCall();
            }
        }

        // ----- End call -----
        function endCall() {
            const duration = callStartTime ? Date.now() - callStartTime : 0;
            const hadCall = isCallActive && callPartner;

            if (hadCall && !isCallInitiator) {
                // If we received a call and ended it, log it
                addCallLog(callPartner, duration, false);
            } else if (hadCall && isCallInitiator && peerConnection?.connectionState === 'connected') {
                addCallLog(callPartner, duration, false);
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            stopLocalStream();
            remoteVideo.srcObject = null;
            remoteVideo.style.display = 'none';
            remotePlaceholder.querySelector('.status').textContent = 'Call ended';
            remotePlaceholder.querySelector('.name').textContent = '';

            callOverlay.classList.remove('active');
            incomingCall.classList.remove('active');

            isCallActive = false;
            isCallInitiator = false;
            callPartner = '';
            callStartTime = null;
            stopCallTimer();

            voiceCallBtn.classList.remove('active-call');
            videoCallBtn.classList.remove('active-call');
            voiceCallBtn.innerHTML = '<i class="fas fa-phone"></i>';
            videoCallBtn.innerHTML = '<i class="fas fa-video"></i>';

            callMuteBtn.classList.remove('muted');
            callMuteBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            callVideoToggleBtn.classList.remove('video-off');
            callVideoToggleBtn.innerHTML = '<i class="fas fa-video"></i>';

            // Notify others
            if (hadCall && callPartner) {
                broadcast({ type: 'webrtc_end', from: currentUser, to: callPartner });
            }

            pendingOffer = null;
        }

        // ----- Update call controls -----
        function updateCallControls() {
            callMuteBtn.onclick = () => {
                if (!localStream) return;
                const track = localStream.getAudioTracks()[0];
                if (track) {
                    track.enabled = !track.enabled;
                    callMuteBtn.classList.toggle('muted');
                    callMuteBtn.innerHTML = track.enabled ? '<i class="fas fa-microphone"></i>' :
                        '<i class="fas fa-microphone-slash"></i>';
                }
            };

            callVideoToggleBtn.onclick = () => {
                if (!localStream) return;
                const track = localStream.getVideoTracks()[0];
                if (track) {
                    track.enabled = !track.enabled;
                    callVideoToggleBtn.classList.toggle('video-off');
                    callVideoToggleBtn.innerHTML = track.enabled ? '<i class="fas fa-video"></i>' :
                        '<i class="fas fa-video-slash"></i>';
                }
            };

            endCallBtn.onclick = endCall;
        }

        // ----- Call buttons -----
        voiceCallBtn.addEventListener('click', () => {
            if (isCallActive) {
                endCall();
            } else if (currentPartner) {
                initiateCall(currentPartner, false);
            }
        });

        videoCallBtn.addEventListener('click', () => {
            if (isCallActive) {
                endCall();
            } else if (currentPartner) {
                initiateCall(currentPartner, true);
            }
        });

        // ============================================================
        //  PROFILE
        // ============================================================
        function loadProfile() {
            const profile = userProfiles[currentUser] || {};
            profileNameInput.value = profile.name || currentUser;
            profileStatusInput.value = profile.status || 'Hey there!';
            if (profile.photo) {
                profilePreviewImg.src = profile.photo;
                profilePreviewImg.style.display = 'block';
                profilePreviewText.style.display = 'none';
            } else {
                profilePreviewImg.style.display = 'none';
                profilePreviewText.style.display = 'block';
                profilePreviewText.textContent = getInitials(currentUser);
            }
            // Update sidebar
            updateSidebarProfile();
        }

        function updateSidebarProfile() {
            const profile = userProfiles[currentUser] || {};
            myName.textContent = profile.name || currentUser;
            myStatus.textContent = profile.status || 'Hey there!';
            if (profile.photo) {
                myAvatarImg.src = profile.photo;
                myAvatarImg.style.display = 'block';
                myAvatarText.style.display = 'none';
            } else {
                myAvatarImg.style.display = 'none';
                myAvatarText.style.display = 'block';
                myAvatarText.textContent = getInitials(currentUser);
            }
        }

        function saveProfile() {
            const name = profileNameInput.value.trim() || currentUser;
            const status = profileStatusInput.value.trim() || 'Hey there!';
            const photo = profilePreviewImg.src || null;

            userProfiles[currentUser] = { name, status, photo };
            saveData();
            broadcast({ type: 'profile_update', from: currentUser, profile: userProfiles[currentUser] });
            updateSidebarProfile();
            renderUsers();
            updateChatHeader();
            profileModal.classList.remove('active');
        }

        profileBtn.addEventListener('click', () => {
            loadProfile();
            profileModal.classList.add('active');
        });

        profileCloseBtn.addEventListener('click', () => {
            profileModal.classList.remove('active');
        });

        profileSaveBtn.addEventListener('click', saveProfile);

        profilePreview.addEventListener('click', () => {
            profileFileInput.click();
        });

        profileFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('Please select an image.');
                profileFileInput.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
                const dataUrl = ev.target.result;
                profilePreviewImg.src = dataUrl;
                profilePreviewImg.style.display = 'block';
                profilePreviewText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });

        // ============================================================
        //  STATUS
        // ============================================================
        statusBtn.addEventListener('click', () => {
            statusTextInput.value = '';
            statusPhotoInput.value = '';
            statusPhotoPreview.innerHTML = '<span>No photo selected</span>';
            statusTypeSelect.value = 'text';
            statusTextArea.style.display = 'block';
            statusPhotoArea.style.display = 'none';
            newStatusModal.classList.add('active');
        });

        statusTypeSelect.addEventListener('change', () => {
            const val = statusTypeSelect.value;
            statusTextArea.style.display = val === 'text' ? 'block' : 'none';
            statusPhotoArea.style.display = val === 'photo' ? 'block' : 'none';
        });

        statusPhotoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('Please select an image.');
                statusPhotoInput.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
                const dataUrl = ev.target.result;
                statusPhotoPreview.innerHTML =
                    `<img src="${dataUrl}" style="max-width:100%;max-height:200px;border-radius:8px;" />`;
            };
            reader.readAsDataURL(file);
        });

        newStatusCloseBtn.addEventListener('click', () => {
            newStatusModal.classList.remove('active');
        });

        newStatusPostBtn.addEventListener('click', () => {
            const type = statusTypeSelect.value;
            let content = '';
            let photo = null;

            if (type === 'text') {
                content = statusTextInput.value.trim();
                if (!content) { alert('Please enter a status.'); return; }
            } else {
                const file = statusPhotoInput.files[0];
                if (!file) { alert('Please select a photo.'); return; }
                // Read the file
                const reader = new FileReader();
                reader.onload = (ev) => {
                    photo = ev.target.result;
                    postStatus('photo', photo, '');
                };
                reader.readAsDataURL(file);
                return;
            }

            postStatus('text', null, content);
        });

        function postStatus(type, photo, text) {
            const status = {
                type: type,
                text: text || '',
                photo: photo || null,
                timestamp: Date.now()
            };
            statuses[currentUser] = status;
            saveData();
            broadcast({ type: 'status_update', from: currentUser, status });
            newStatusModal.classList.remove('active');
            renderUsers();
            // Show own status
            showStatus(currentUser);
        }

        // View status
        function showStatus(user) {
            const s = statuses[user];
            if (!s) return;
            if (s.timestamp < Date.now() - 24 * 60 * 60 * 1000) {
                alert('Status expired.');
                return;
            }

            statusName.textContent = getDisplayName(user);
            const photo = getUserPhoto(user);
            statusAvatar.innerHTML = photo ? `<img src="${photo}" />` : getInitials(user);
            statusAvatar.style.background = photo ? 'transparent' : getAvatarColor(user);
            statusTime.textContent = formatTime(s.timestamp) + ' · ' + formatDate(s.timestamp);

            if (s.type === 'text') {
                statusContent.innerHTML = `<div class="status-text">${escapeHtml(s.text)}</div>`;
            } else if (s.type === 'photo' && s.photo) {
                statusContent.innerHTML = `<img src="${s.photo}" class="status-image" />`;
            }

            statusView.classList.add('active');
        }

        statusCloseBtn.addEventListener('click', () => {
            statusView.classList.remove('active');
        });

        // Click on user's status indicator in chat list
        document.addEventListener('click', (e) => {
            const item = e.target.closest('.user-item');
            if (item) {
                const user = item.dataset.user;
                if (user && statuses[user] && statuses[user].timestamp > Date.now() - 24 * 60 * 60 * 1000) {
                    // If clicked on the status indicator area
                    if (e.target.closest('.avatar') || e.target.closest('.name')) {
                        showStatus(user);
                    }
                }
            }
        });

        // ============================================================
        //  TABS
        // ============================================================
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderUsers();
            });
        });

        // ============================================================
        //  SEARCH
        // ============================================================
        searchInput.addEventListener('input', renderUsers);

        // ============================================================
        //  LOGOUT
        // ============================================================
        logoutBtn.addEventListener('click', () => {
            if (isCallActive) endCall();
            sendOfflineStatus();
            currentUser = '';
            currentPartner = '';
            localStorage.removeItem('friendverse_' + currentUser);
            mainApp.classList.remove('visible');
            loginScreen.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
            usernameInput.focus();
            if (channel) {
                try { channel.close(); } catch (e) {}
                channel = null;
            }
        });

        // ============================================================
        //  LOGIN
        // ============================================================
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Please fill in all fields.';
                loginError.style.display = 'block';
                return;
            }
            if (username.length < 2 || username.length > 20) {
                loginError.textContent = 'Username must be 2–20 characters.';
                loginError.style.display = 'block';
                return;
            }
            if (password.length < 4) {
                loginError.textContent = 'Password must be at least 4 characters.';
                loginError.style.display = 'block';
                return;
            }

            loginError.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            // Simulate login
            setTimeout(() => {
                currentUser = username;
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';

                // Init channel
                initChannel();

                // Load data
                loadData();
                loadAllProfiles();

                // Set default profile
                if (!userProfiles[currentUser]) {
                    userProfiles[currentUser] = {
                        name: currentUser,
                        status: 'Hey there!',
                        photo: null
                    };
                    saveData();
                }

                // Load statuses from others
                loadAllProfiles();

                // Update UI
                updateSidebarProfile();
                loginScreen.classList.add('hidden');
                mainApp.classList.add('visible');

                // Broadcast online
                sendOnlineStatus();

                // Ping other tabs to update their lists
                broadcast({ type: 'ping', from: currentUser });

                // Render
                renderUsers();
                updateChatHeader();

                // Select first chat if exists
                const chatKeys = Object.keys(messages).filter(k => k !== currentUser);
                if (chatKeys.length > 0) {
                    switchChat(chatKeys[0]);
                } else {
                    // Show empty state
                    messagesContainer.innerHTML = `
                <div class="empty-state">
                  <i class="fas fa-comment-dots"></i>
                  <p>Select a friend to start chatting</p>
                </div>
              `;
                    document.getElementById('inputArea').style.display = 'flex';
                }

                // Periodic online ping
                setInterval(() => {
                    if (currentUser) {
                        sendOnlineStatus();
                    }
                }, 30000);

                // Auto-logout on tab close
                window.addEventListener('beforeunload', () => {
                    if (currentUser) {
                        sendOfflineStatus();
                    }
                });

            }, 800);
        });

        // ============================================================
        //  INIT
        // ============================================================
        msgInput.style.height = 'auto';
        usernameInput.focus();

        console.log('🚀 FriendVerse — WhatsApp-style Demo');
        console.log('📌 Open multiple tabs with different usernames to chat.');
        console.log('📹 Voice & Video calls work between tabs via WebRTC.');
        console.log('📁 Data stored in localStorage per user.');
        console.log('💚 Status updates expire after 24 hours.');
    </script>

</body>
</html>
